name: reconcile-current-h3-api

on:
  push:
    branches:
      - fix-comfy-h3-packedlayout-api

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-comfy-h3-packedlayout-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt numpy safetensors pytest
      - name: Apply reconciliation
        run: python .github/patch_current_h3_api.py
      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m pytest -q -p no:cacheprovider
          git diff --check
      - name: Commit reconciled code
        run: |
          git config user.name "ComfyUI H3 compatibility bot"
          git config user.email "compat@local.invalid"
          git add \
            compatibility.py \
            continuation.py \
            nodes.py \
            layout_adapter.py \
            model_patch.py \
            tests/test_compatibility.py \
            tests/test_nodes_logic.py \
            tests/test_layout_adapter.py \
            CHANGELOG.md
          git diff --cached --stat
          git commit -m "Fix current ComfyUI H3 PackedLayout compatibility"
          git push origin HEAD:fix-comfy-h3-packedlayout-api
