name: loader-repair-validation
on:
  push:
    branches: [codex/loader-repair-20260921]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve follow-up script and check out tested main
        run: |
          cp .github/loader-followup.py "$RUNNER_TEMP/loader-followup.py"
          git checkout --detach f8eb40d8b44e54386bcf3c5197c48f0f71daf6df
          test -z "$(git status --porcelain)"
      - name: Snapshot before follow-up changes
        shell: pwsh
        run: |
          ./tools/snapshot.ps1 -Source $PWD -SnapshotRoot "$env:RUNNER_TEMP/loader-snapshots" -Label before-loader-followup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt numpy safetensors pytest psutil opencv-python-headless Pillow
      - name: Update approved workflow fingerprint and validate full suite
        run: python "$RUNNER_TEMP/loader-followup.py"
      - name: Commit tested follow-up to a review branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test: synchronize approved loader workflow integration fingerprint" -m "Preserve all Decode Cache assertions and record complete CPU/Node suite results. No additional runtime or workflow changes."
          git push origin "HEAD:refs/heads/codex/loader-followup-verified-${{ github.run_id }}"
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
