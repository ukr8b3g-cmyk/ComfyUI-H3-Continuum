name: validate-current-h3-contract

on:
  push:
    branches:
      - fix-comfy-h3-packedlayout-api

permissions:
  contents: read

jobs:
  native-h3-contract:
    strategy:
      fail-fast: false
      matrix:
        comfy_ref:
          - 03fa4e48ba524173736bf299ee0f981fc57c7414
          - e01fb4c56b7a88149d469b99cbbfe3223d715054
          - b963f4ad210a42841ab23dfc28a84143a0cce227
    runs-on: ubuntu-latest
    steps:
      - name: Check out Continuum fix
        uses: actions/checkout@v4
      - name: Check out ComfyUI revision
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy_ref }}
          path: ComfyUI
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy psutil safetensors einops tqdm pyyaml pillow packaging comfy-kitchen==0.2.26 comfy-aimdo==0.4.13
      - name: Run native H3 runtime verifier
        run: python tools/verify_runtime.py --comfy-root ComfyUI
