name: Prompt skill timeline syntax update

on:
  push:
    branches:
      - automation/skill-timeline-syntax-20260912

permissions:
  contents: write

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt numpy safetensors pytest psutil opencv-python-headless Pillow

      - name: Snapshot authoritative checkout
        shell: pwsh
        run: ./tools/snapshot.ps1 -Source $PWD -SnapshotRoot /tmp/h3-continuum-snapshots -Label pre-skill-timeline-syntax

      - name: Update packaged prompt skill
        env:
          BASELINE_SHA: bd12073c4322a88ce666fe062b7bb265f5de131a
        run: python .github/skill_timeline_syntax_update.py

      - name: Validate current prompt parser baseline
        run: python -m pytest tests/test_v2_prompts.py -q -p no:cacheprovider

      - name: Remove helpers and commit validated result
        shell: bash
        run: |
          rm -f .github/workflows/skill_timeline_syntax_update.yml
          rm -f .github/skill_timeline_syntax_update.py
          rm -f skill_update_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs: harden Continuum Timeline prompt skill syntax"
          git push origin HEAD:automation/skill-timeline-syntax-20260912
